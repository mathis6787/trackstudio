services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    ports:
      - "8554:8554" # RTSP
      - "8554:8554/udp"
      - "1935:1935" # RTMP
      - "8888:8888" # HLS
      - "8889:8889" # WebRTC
      - "8189:8189/udp" # WebRTC UDP
      - "9997:9997" # API
    environment:
      # Protocols configuration removed - using defaults from mediamtx.yml
      - MTX_RTSPADDRESS=:8554
      - MTX_RTMPADDRESS=:1935
      - MTX_HLSADDRESS=:8888
      - MTX_WEBRTCADDRESS=:8889
      - MTX_APIADDRESS=:9997
      # Enable all paths by default - streams will be created on-demand
      - MTX_PATHS_ALL=yes
      # Log configuration
      - MTX_LOGLEVEL=info
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    restart: unless-stopped
